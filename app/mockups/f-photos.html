<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-pets · variante F avec photos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{--page:#E9E9EC;--ptx:#0A0A0A}
body.dark{--page:#111113;--ptx:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ptx);font-family:Nunito,system-ui,sans-serif;padding:32px 24px 64px;transition:background .2s}
header{display:flex;align-items:center;gap:16px;justify-content:space-between;max-width:1300px;margin:0 auto 28px}
h1{font-size:20px;margin:0;font-weight:700}
.tg{display:flex;background:rgba(128,128,128,.2);border-radius:10px;padding:3px}
.tg button{border:0;background:none;color:inherit;font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;cursor:pointer}
.tg button.on{background:#fff;color:#0A0A0A;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;max-width:1300px;margin:0 auto}
figure{margin:0}
figcaption{text-align:center;font-size:14px;margin-top:12px;opacity:.7}

.phone{--bg:#fff;--tx:#0A0A0A;--sec:#8A8A8E;--hl:#ECECEE;--cr:#F2F2F4;--gr:#00A862;--am:#D97706;--btn:#0A0A0A;--bt:#fff;
 --c1:#FFD9CF;--i1:#E5532F;--c2:#FFEBB8;--i2:#B97A00;--c3:#D5EFE0;--i3:#2E8B57;--c4:#DDE4FF;--i4:#4B5FD6;
 width:375px;height:780px;background:var(--bg);color:var(--tx);border-radius:44px;border:1px solid #D5D5D9;overflow:hidden;display:flex;flex-direction:column;font-size:16px;line-height:1.35}
body.dark .phone{--bg:#000;--tx:#fff;--sec:#8E8E93;--hl:#1C1C1E;--cr:#1C1C1E;--gr:#2FD27A;--am:#F5A524;--btn:#fff;--bt:#000;border-color:#2A2A2D;
 --c1:#3B2620;--i1:#FF8A6B;--c2:#3A3018;--i2:#F2C14E;--c3:#1F3329;--i3:#5FD39A;--c4:#232A4A;--i4:#8FA0FF}
.sb{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:16px 30px 0;height:50px;flex:none}
.pd{padding:0 24px}
.nav{display:flex;justify-content:space-between;align-items:center;height:44px;font-size:24px}
.h{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.s{color:var(--sec)}
.hr{border-top:1px solid var(--hl)}
.r{display:flex;align-items:center;gap:14px}
.ic{width:44px;height:44px;border-radius:50%;background:var(--c,var(--cr));color:var(--i,var(--tx));display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.av{width:var(--s,56px);height:var(--s,56px);border-radius:50%;overflow:hidden;background:var(--c,var(--cr));color:var(--i,var(--tx));display:flex;align-items:center;justify-content:center;font-size:calc(var(--s,56px)*.45);flex:none;position:relative}
.av svg{width:100%;height:100%;display:block}
.badge{position:absolute;right:0;bottom:0;width:30px;height:30px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid var(--bg)}
.stack{display:flex}.stack .av{border:3px solid var(--bg);margin-left:-16px}.stack .av:first-child{margin-left:0}
.item{padding:13px 0}
.t1{font-size:17px;font-weight:700}
.t2{font-size:14px;color:var(--sec);font-weight:600}
.val{text-align:right}
.btn{background:var(--btn);color:var(--bt);border-radius:14px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.foot{margin-top:auto;padding:0 24px 34px}
.fd{border-bottom:1.5px solid var(--hl);padding:6px 0 10px;margin-bottom:14px}
.fd .l{font-size:13px;color:var(--sec);font-weight:600}
.fd .v{font-size:18px;font-weight:700;margin-top:2px}
.fd.on{border-bottom:2px solid var(--tx)}
.chip{background:var(--cr);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg)}
.seg{display:flex;background:var(--cr);border-radius:12px;padding:3px}
.seg div{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:14px;font-weight:700;color:var(--sec)}
.seg .on{background:var(--bg);color:var(--tx)}
.up{color:var(--gr);font-weight:800;font-size:15px}
.am{color:var(--am)}
</style>
</head>
<body>
<header>
  <h1>my-pets · variante F avec photos (375 × 780)</h1>
  <div class="tg" role="group" aria-label="Thème"><button class="on" data-t="light">Clair</button><button data-t="dark">Noir</button></div>
</header>
<div class="row" id="row"></div>

<script>
const CAT = n => `https://loremflickr.com/400/400/cat?lock=${n}`;
const DOG = n => `https://loremflickr.com/400/400/dog?lock=${n}`;
const catSvg = (fur, ear, bg) => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/><ellipse cx="50" cy="104" rx="38" ry="22" fill="${fur}"/><polygon points="22,40 26,10 47,27" fill="${fur}"/><polygon points="78,40 74,10 53,27" fill="${fur}"/><polygon points="27,34 29,19 39,27" fill="${ear}"/><polygon points="73,34 71,19 61,27" fill="${ear}"/><ellipse cx="50" cy="56" rx="32" ry="28" fill="${fur}"/><ellipse cx="38" cy="52" rx="4" ry="5" fill="#2D1B14"/><ellipse cx="62" cy="52" rx="4" ry="5" fill="#2D1B14"/><circle cx="39.5" cy="50" r="1.4" fill="#fff"/><circle cx="63.5" cy="50" r="1.4" fill="#fff"/><path d="M46 62h8l-4 5z" fill="${ear}"/><path d="M50 67q0 5-6 5M50 67q0 5 6 5" stroke="#2D1B14" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M30 62L16 59M30 66L16 68M70 62l14-3M70 66l14 2" stroke="#2D1B14" stroke-width="1.2" opacity=".45"/></svg>`;
const dogSvg = (fur, ear, bg) => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/><ellipse cx="50" cy="104" rx="38" ry="22" fill="${fur}"/><ellipse cx="22" cy="48" rx="12" ry="22" fill="${ear}" transform="rotate(12 22 48)"/><ellipse cx="78" cy="48" rx="12" ry="22" fill="${ear}" transform="rotate(-12 78 48)"/><ellipse cx="50" cy="52" rx="28" ry="27" fill="${fur}"/><ellipse cx="50" cy="63" rx="15" ry="11" fill="#FFF4E4"/><ellipse cx="38" cy="47" rx="3.8" ry="4.6" fill="#2D1B14"/><ellipse cx="62" cy="47" rx="3.8" ry="4.6" fill="#2D1B14"/><circle cx="39.3" cy="45.4" r="1.3" fill="#fff"/><circle cx="63.3" cy="45.4" r="1.3" fill="#fff"/><ellipse cx="50" cy="58" rx="6" ry="4.5" fill="#2D1B14"/><path d="M50 62v5M50 67q-6 5-9 1M50 67q6 5 9 1" stroke="#2D1B14" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="73" rx="4" ry="5" fill="#F28B9B"/></svg>`;
const PORTRAITS = {
  [CAT(11)]: catSvg('#F2A65A', '#FFC9A3', '#FFD9CF'),
  [DOG(22)]: dogSvg('#D9B38C', '#9B6B43', '#D5EFE0'),
  [CAT(33)]: catSvg('#B8BEC8', '#F4B8C4', '#FFEBB8')
};
const photo = url => PORTRAITS[url];
const NALA = s => `<span class="av" style="--s:${s}px;--c:var(--c1);--i:var(--i1)">${photo(CAT(11),'cat')}</span>`;
const MIKO = s => `<span class="av" style="--s:${s}px;--c:var(--c3);--i:var(--i3)">${photo(DOG(22),'dog')}</span>`;
const col = k => `--c:var(--c${k});--i:var(--i${k})`;
const SB = '<div class="sb"><span>9:41</span><span>5G</span></div>';

const screens = [
 ['1 · Connexion', `${SB}
  <div class="pd" style="margin-top:40px">
   <div class="stack" style="margin-bottom:26px">${NALA(76)}${MIKO(76)}<span class="av" style="--s:76px;--c:var(--c2);--i:var(--i2)">${photo(CAT(33),'cat')}</span></div>
   <div class="h">Connexion</div>
   <div class="s" style="margin:10px 0 34px;font-size:17px;font-weight:600">Retrouvez le carnet de vos animaux.</div>
   <div class="fd on"><div class="l">E-mail</div><div class="v">yassine@mail.com</div></div>
   <div class="fd"><div class="l">Mot de passe</div><div class="v">••••••••••</div></div></div>
  <div class="foot"><div class="btn">Continuer</div><div class="s" style="text-align:center;margin-top:16px;font-size:15px">Pas encore de compte ? <b style="color:var(--tx)">Créer un compte</b></div></div>`],

 ['2 · Mes animaux', `${SB}
  <div class="pd"><div class="nav"><span class="s" style="font-size:15px;font-weight:700">Bonjour Yassine</span><span class="av" style="--s:38px;--c:var(--tx);--i:var(--bg);font-size:16px;font-weight:800">Y</span></div>
   <div class="h" style="margin:10px 0 18px">Mes animaux</div>
   <div class="r item">${NALA(60)}<div style="flex:1"><div class="t1">Nala</div><div class="t2">Chat · 3 ans</div></div><div class="val"><div class="t1">4,2 kg</div><div class="t2" style="font-size:13px">8 oct.</div></div></div><div class="hr"></div>
   <div class="r item">${MIKO(60)}<div style="flex:1"><div class="t1">Miko</div><div class="t2">Chien · 6 ans</div></div><div class="val"><div class="t1">18,6 kg</div><div class="t2" style="font-size:13px">2 sept.</div></div></div><div class="hr"></div>
   <div class="r item" style="font-weight:800"><span class="av" style="--s:60px"><i class="ti ti-plus"></i></span>Ajouter un animal</div></div>`],

 ['3 · Animal', `${SB}
  <div class="pd"><div class="nav"><i class="ti ti-arrow-left"></i></div>
   <div class="h" style="margin:10px 0 22px;font-size:30px">Modifier Nala</div>
   <div style="display:flex;justify-content:center;margin-bottom:24px"><span class="av" style="--s:112px;overflow:visible"><span style="width:100%;height:100%;border-radius:50%;overflow:hidden;display:block">${photo(CAT(11),'cat')}</span><span class="badge"><i class="ti ti-camera"></i></span></span></div>
   <div class="r" style="gap:8px;margin-bottom:22px"><span class="chip on">Chat</span><span class="chip">Chien</span><span class="chip">Autre</span></div>
   <div class="fd on"><div class="l">Nom</div><div class="v">Nala</div></div>
   <div class="fd"><div class="l">Date de naissance</div><div class="v">14 mars 2023</div></div></div>
  <div class="foot"><div class="btn">Enregistrer</div></div>`],

 ['4 · Fiche animal', `${SB}
  <div class="pd"><div class="nav"><i class="ti ti-arrow-left"></i><i class="ti ti-pencil" style="font-size:22px"></i></div>
   <div class="r" style="gap:16px;margin:8px 0 16px">${NALA(92)}<div><div style="font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1">Nala</div><div class="s" style="font-weight:600">Chat européen · 3 ans</div></div></div>
   <div style="font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:1.1">4,2 kg</div>
   <div class="up" style="margin-bottom:18px">+0,1 kg depuis juillet</div>
   <div class="r" style="gap:8px;margin-bottom:10px;overflow:hidden"><span class="chip on">Tout</span><span class="chip">Vaccins</span><span class="chip">Soins</span><span class="chip">Visites</span></div>
   <div class="hr"></div>
   <div class="r item"><span class="ic" style="${col(1)}"><i class="ti ti-vaccine"></i></span><div style="flex:1"><div class="t1">Typhus-coryza</div><div class="t2">Prochain : 3 mars 2027</div></div><span class="t2" style="font-size:13px">3 mars</span></div><div class="hr"></div>
   <div class="r item"><span class="ic" style="${col(2)}"><i class="ti ti-pill"></i></span><div style="flex:1"><div class="t1">Milbemax</div><div class="t2 am">Prochain : 12 avr.</div></div><span class="t2" style="font-size:13px">12 janv.</span></div><div class="hr"></div>
   <div class="r item"><span class="ic" style="${col(3)}"><i class="ti ti-stethoscope"></i></span><div style="flex:1"><div class="t1">Visite annuelle</div><div class="t2">Dr Martin</div></div><span class="t2" style="font-size:13px">8 oct. 25</span></div></div>
  <div class="foot"><div class="btn">Ajouter une entrée</div></div>`],

 ['5 · Nouvelle entrée', `${SB}
  <div class="pd"><div class="nav"><i class="ti ti-arrow-left"></i></div>
   <div class="h" style="margin:10px 0 14px;font-size:30px">Nouvelle entrée</div>
   <div class="r" style="gap:10px;margin-bottom:20px">${NALA(32)}<span class="s" style="font-weight:700">Pour Nala</span></div>
   <div class="seg" style="margin-bottom:24px"><div class="on">Vaccin</div><div>Soin</div><div>Visite</div><div>Poids</div></div>
   <div class="fd"><div class="l">Date</div><div class="v">12 octobre 2026</div></div>
   <div class="fd on"><div class="l">Produit</div><div class="v">Rappel annuel</div></div>
   <div class="fd"><div class="l">Prochaine échéance · facultatif</div><div class="v s">12 octobre 2027</div></div>
   <div class="fd"><div class="l">Note · facultatif</div><div class="v s">Dr Martin</div></div></div>
  <div class="foot"><div class="btn">Enregistrer</div></div>`]
];
document.getElementById('row').innerHTML = screens.map(([c, h]) => `<figure><div class="phone">${h}</div><figcaption>${c}</figcaption></figure>`).join('');
document.querySelectorAll('.tg button').forEach(b => b.addEventListener('click', () => {
  document.body.classList.toggle('dark', b.dataset.t === 'dark');
  document.querySelectorAll('.tg button').forEach(x => x.classList.toggle('on', x === b));
}));
</script>
</body>
</html>
