<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <script>
      // Anti-flash : la clé doit rester égale à THEME_STORAGE_KEY (src/lib/color-scheme.ts).
      (function () {
        try {
          var pref = 'system';
          try {
            var v = localStorage.getItem('mypets.theme');
            if (v === 'light' || v === 'dark') pref = v;
          } catch (e) {}
          var t = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : sans lui env(safe-area-inset-*) vaut 0 sur iOS et la barre d'onglets passe sous la barre Safari / l'indicateur d'accueil. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="splash-style">
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #8a8a8e;
        font-family: -apple-system, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #splash {
          background: #000000;
          color: #8e8e93;
        }
      }
      :root[data-theme="dark"] #splash {
        background: #000000;
        color: #8e8e93;
      }
      #splash img {
        border-radius: 22px;
      }
      #splash.splash-hide {
        opacity: 0;
        transition: opacity 200ms;
        pointer-events: none;
      }
      #splash-fun {
        margin: 20px 0 0;
        min-height: 20px;
        font-size: 15px;
        line-height: 20px;
        text-align: center;
        transition: opacity 200ms;
      }
      #splash-fun.splash-fun-out {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-fun {
          transition: none;
        }
      }
      #splash-msg {
        margin: 12px 0 0;
        max-width: 280px;
        text-align: center;
        font-size: 14px;
        line-height: 20px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="splash" role="status" aria-label="Chargement">
      <img src="/icons/icon-192.png" width="96" height="96" alt="" />
      <p id="splash-fun" aria-hidden="true"></p>
      <p id="splash-msg" hidden></p>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script id="splash-fun-script">
      // Phrases rotatives du splash : une toutes les 2 s (fondu 200 ms), tant que #splash est là.
      (function () {
        var el = document.getElementById('splash-fun');
        if (!el) return;
        var PHRASES = [
          'Nettoyage des litières…',
          'Ravitaillement des croquettes…',
          "Remplissage des gamelles d'eau…",
          'Brossage des poils…',
          'Recherche de la balle sous le canapé…',
          'Négociation avec le chat…',
          'Promenade du chien…',
          'Comptage des moustaches…',
          'Réveil du hamster…',
          'Vérification du carnet de vaccins…',
          'Coupe des griffes…',
          'Distribution des friandises…',
          "Nettoyage de l'aquarium…",
          'Installation du panier…'
        ];
        var queue = [];
        var last = '';
        function next() {
          if (!queue.length) {
            queue = PHRASES.slice();
            for (var i = queue.length - 1; i > 0; i--) {
              var j = Math.floor(Math.random() * (i + 1));
              var t = queue[i];
              queue[i] = queue[j];
              queue[j] = t;
            }
            if (queue[0] === last) {
              var s = queue[0];
              queue[0] = queue[1];
              queue[1] = s;
            }
          }
          last = queue.shift();
          return last;
        }
        el.textContent = next();
        var timer = setInterval(function () {
          if (!document.getElementById('splash')) {
            clearInterval(timer);
            return;
          }
          el.classList.add('splash-fun-out');
          setTimeout(function () {
            el.textContent = next();
            el.classList.remove('splash-fun-out');
          }, 200);
        }, 2000);
      })();
    </script>
    <script>
      // Réveil du serveur (Render free) : on rassure si le splash est encore là après 6 s.
      setTimeout(function () {
        var splash = document.getElementById('splash');
        var msg = document.getElementById('splash-msg');
        if (!splash || !msg) return;
        msg.textContent = "Un instant… le serveur se réveille, cela peut prendre jusqu'à une minute.";
        msg.hidden = false;
      }, 6000);
    </script>
  </body>
</html>
