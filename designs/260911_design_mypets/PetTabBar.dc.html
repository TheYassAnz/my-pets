<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-316c0700-932b-4f06-a048-fc3b7c211c98/styles.css">
</helmet>
<div style="position:absolute;left:0;right:0;bottom:0;padding:9px 10px 30px;background:linear-gradient(to top,#161826 66%,rgba(22,24,38,0));display:flex;font-family:Inter,system-ui,sans-serif">
  <sc-for list="{{ items }}" as="i" hint-placeholder-count="5">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;color:{{ i.color }}">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ i.icon }}"></path></svg>
      <span style="font-size:10px">{{ i.label }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accueil&quot;,&quot;foyer&quot;,&quot;sante&quot;,&quot;agenda&quot;,&quot;profil&quot;],&quot;default&quot;:&quot;accueil&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ITEMS = [
  { id: 'accueil', label: 'Accueil', icon: 'M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z' },
  { id: 'foyer', label: 'Foyer', icon: 'M5.5 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm13 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM9.5 7.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm5 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM12 12c-2.5 0-4.5 2-4.5 4.4C7.5 19 9 20.5 12 20.5s4.5-1.5 4.5-4.1C16.5 14 14.5 12 12 12Z' },
  { id: 'sante', label: 'Santé', icon: 'M3 12h4l2-5 3 10 2.5-5H21' },
  { id: 'agenda', label: 'Agenda', icon: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z' },
  { id: 'profil', label: 'Profil', icon: 'M4 20c0-4 3.6-6 8-6s8 2 8 6M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z' },
];

class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'accueil';
    return {
      items: ITEMS.map(i => ({
        ...i,
        color: i.id === a ? 'var(--color-accent)' : 'var(--color-neutral-600)',
      })),
    };
  }
}
</script>
</body>
</html>
